name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version PR or release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing (OIDC) for @furrow/mcp.
      id-token: write
    outputs:
      desktop-version: ${{ steps.desktop.outputs.version }}
      web-version: ${{ steps.web.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # With pending changesets: opens/updates the "Version Packages" PR.
      # After that PR is merged: tags each bumped package and creates GitHub Releases.
      # All packages are private, so nothing is published to npm here; the
      # MCP server is published by its own step below.
      # v2 is required for Changesets CLI v3.
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true

      # Releases made with this workflow's token don't trigger other workflows,
      # so the desktop installers are built from here (desktop.yml).
      # `changeset publish` tags the released commit. Its tags are read from git:
      # the action's `publishedPackages` output is empty with Changesets CLI v3.
      - name: Desktop version released
        id: desktop
        run: |
          tag=$(git tag --points-at HEAD --list '@furrow/desktop@*' | head -n 1)
          echo "version=${tag#@furrow/desktop@}" >> "$GITHUB_OUTPUT"

      - name: Web version released
        id: web
        run: |
          tag=$(git tag --points-at HEAD --list '@furrow/web@*' | head -n 1)
          echo "version=${tag#@furrow/web@}" >> "$GITHUB_OUTPUT"

      # @furrow/mcp is the one package on npm (ADR-0067). It stays private for
      # `changeset publish`, which only tags it, and is published here, last and
      # allowed to fail, so a problem on npm can't hold up the desktop and web
      # releases. npm trusted publishing (OIDC) authenticates and adds
      # provenance: no token. Its prepack bundles the private packages it uses.
      - name: Publish the MCP server to npm
        id: mcp
        continue-on-error: true
        working-directory: apps/mcp
        run: |
          tag=$(git tag --points-at HEAD --list '@furrow/mcp@*' | head -n 1)
          if [ -z "$tag" ]; then echo "No new @furrow/mcp version to publish"; exit 0; fi
          npm pkg delete private devDependencies
          npm publish

      - name: MCP server not published
        if: steps.mcp.outcome == 'failure'
        run: echo "::warning::@furrow/mcp was not published to npm; ADR-0067 says how to publish it by hand"

  desktop:
    name: Desktop installers
    needs: release
    if: needs.release.outputs.desktop-version != ''
    uses: ./.github/workflows/desktop.yml
    with:
      tag: "@furrow/desktop@${{ needs.release.outputs.desktop-version }}"
    permissions:
      contents: write

  # furrow.cam shows the newest web app version, read from the releases when it's built.
  site:
    name: Rebuild furrow.cam
    needs: release
    if: needs.release.outputs.web-version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::SITE_DEPLOY_HOOK is not set, furrow.cam was not rebuilt"; exit 0; fi
          curl -fsS -X POST "$HOOK"
