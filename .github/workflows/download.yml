name: Download links

# Deploys apps/download, the Worker behind download.furrow.cam (ADR-0049), when it
# changes on main. Needs the CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus Workers
# Routes: Edit and DNS: Edit on furrow.cam for the custom domain) and
# CLOUDFLARE_ACCOUNT_ID secrets. The Worker's GITHUB_TOKEN is a Worker secret, set once
# with `wrangler secret put`.
on:
  push:
    branches: [main]
    paths:
      - apps/download/**
      - .github/workflows/download.yml
  workflow_dispatch:

concurrency:
  group: download
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @furrow/download

      - run: pnpm --filter @furrow/download test

      - run: pnpm --filter @furrow/download run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
