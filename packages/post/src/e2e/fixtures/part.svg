<?xml version="1.0" encoding="UTF-8"?>
<!-- A part on a 120 × 80 mm page: a 100 × 60 mm outline with 5 mm corners, four Ø8 mm holes and a 52 × 12 mm slot. -->
<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="80mm" viewBox="0 0 120 80">
  <g id="Outline">
    <rect id="Outline" x="10" y="10" width="100" height="60" rx="5" fill="none" stroke="black" stroke-width="0.25"/>
  </g>
  <g id="Holes">
    <circle id="Hole 1" cx="20" cy="20" r="4" fill="none" stroke="black" stroke-width="0.25"/>
    <circle id="Hole 2" cx="100" cy="20" r="4" fill="none" stroke="black" stroke-width="0.25"/>
    <circle id="Hole 3" cx="20" cy="60" r="4" fill="none" stroke="black" stroke-width="0.25"/>
    <circle id="Hole 4" cx="100" cy="60" r="4" fill="none" stroke="black" stroke-width="0.25"/>
  </g>
  <g id="Pocket">
    <rect id="Slot" x="34" y="34" width="52" height="12" rx="6" fill="none" stroke="black" stroke-width="0.25"/>
  </g>
</svg>
