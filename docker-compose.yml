# Local development database. Production uses Neon (ADR-0005).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: furrow
      POSTGRES_PASSWORD: furrow
      POSTGRES_DB: furrow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furrow"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
