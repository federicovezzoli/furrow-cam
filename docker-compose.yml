# Local development database. Production uses Neon (ADR-0005); keep the major version in sync.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: furrow
      POSTGRES_PASSWORD: furrow
      POSTGRES_DB: furrow
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furrow"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
