# Unsigned installers for the GitHub Release (ADR-0044, PRD-0007 D1).
appId: com.furrowcam.desktop
productName: Furrow CAM
# One name per platform and architecture, without spaces, for the release page.
artifactName: furrow-cam-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
# Everything is bundled into out/, so the app ships no node_modules.
npmRebuild: false
fileAssociations:
  - ext: furrow
    name: Furrow CAM project
    description: Furrow CAM project
    mimeType: application/x-furrow-project
    role: Editor
mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ad-hoc signature: unsigned arm64 apps are reported as "damaged" by Gatekeeper.
  identity: "-"
  # Only needed for notarization; with an ad-hoc signature it breaks library validation.
  hardenedRuntime: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  # The package name (`@furrow/desktop`) can't name a file.
  executableName: furrow-cam
  # Lets desktop environments link the running window to its launcher.
  syncDesktopName: true
  category: Graphics
  target: [AppImage, deb, pacman]
  maintainer: Federico Vezzoli <fv@furrow.cam>
pacman:
  # The default would be the product name, and a package name can't have a space.
  packageName: furrow-cam
  # electron-builder writes the description after an empty line, which pacman reads as empty;
  # a later --description wins.
  fpm: ["--description", "Open source 2.5D CAM for CNC routers"]
  # electron-builder's defaults name packages Arch no longer ships (http-parser,
  # libappindicator-gtk3), so `pacman -U` can't resolve them. These are the libraries the
  # Electron binary links against, plus xdg-utils for opening links and folders.
  depends:
    - alsa-lib
    - at-spi2-core
    - cairo
    - dbus
    - expat
    - gcc-libs
    - glib2
    - glibc
    - gtk3
    - libcups
    - libx11
    - libxcb
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxkbcommon
    - libxrandr
    - mesa
    - nspr
    - nss
    - pango
    - systemd-libs
    - xdg-utils
publish: null
