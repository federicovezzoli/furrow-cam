packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/engines": true
  # Downloads the Electron binary for apps/desktop.
  electron: true
  # Squirrel installers; electron-builder builds NSIS instead.
  electron-winstaller: false
  esbuild: false
  prisma: true
  sharp: false
  unrs-resolver: false
  # The Workers runtime that wrangler runs apps/download with; its script only checks the binary.
  workerd: true

catalog:
  typescript: ^5
  vitest: ^5
  zod: ^4.6.5
